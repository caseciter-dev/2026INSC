<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>CiteCase - Supreme Court Judgments Of 2026</title>
  <meta name="description" content="Searchable portal for Supreme Court of India judgments 2026. Instant search by citation, case name, or entity reference.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --font-serif: 'Cinzel', Georgia, serif;
      --font-sans: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      
      --bg-dark: #07090e;
      --bg-card: rgba(19, 26, 41, 0.85);
      --bg-card-hover: rgba(26, 36, 56, 0.95);
      --bg-pill: rgba(255, 255, 255, 0.07);
      --bg-pill-hover: rgba(255, 255, 255, 0.14);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --accent-gold: #fbbf24;
      --gold-glow: rgba(251, 191, 36, 0.25);
      --border-light: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.18);
      --border-gold: rgba(251, 191, 36, 0.4);
      --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    [data-theme='light'] {
      --bg-dark: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-card-hover: #ffffff;
      --bg-pill: rgba(15, 23, 42, 0.06);
      --bg-pill-hover: rgba(15, 23, 42, 0.12);
      
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      
      --accent-gold: #d97706;
      --gold-glow: rgba(217, 119, 6, 0.15);
      --border-light: rgba(15, 23, 42, 0.08);
      --border-medium: rgba(15, 23, 42, 0.18);
      --border-gold: rgba(217, 119, 6, 0.35);
      --shadow-card: 0 10px 30px -10px rgba(15, 23, 42, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--accent-gold);
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }

    .theme-toggle-btn {
      background: var(--bg-pill);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-medium);
      background: var(--bg-pill-hover);
    }

    .center-container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 16px 80px 16px;
      flex: 1;
    }

    .hero-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-title {
      font-family: var(--font-serif);
      font-size: 3rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 1px;
      line-height: 1.1;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--text-primary) 60%, var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-tagline {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
    }

    .search-box-container {
      margin-bottom: 20px;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid var(--border-medium);
      border-radius: 16px;
      padding: 0 18px;
      box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }

    .search-input-wrapper:focus-within {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.2), 0 15px 45px -10px rgba(0, 0, 0, 0.5);
    }

    .search-icon {
      color: var(--accent-gold);
      margin-right: 12px;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .main-search-input {
      width: 100%;
      padding: 16px 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 1.1rem;
      font-family: var(--font-sans);
      font-weight: 500;
    }

    .main-search-input::placeholder {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 400;
    }

    .clear-search-btn {
      background: var(--bg-pill);
      border: none;
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .clear-search-btn.visible {
      display: flex;
    }

    .results-container {
      display: none;
      margin-top: 16px;
    }

    .results-container.visible {
      display: block;
    }

    .results-header-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .case-item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
    }

    .case-item-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-gold);
    }

    .case-item-main {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .citation-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .citation-badge {
      background: rgba(251, 191, 36, 0.15);
      color: var(--accent-gold);
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .pending-badge {
      background: var(--bg-pill);
      color: var(--text-muted);
      border: 1px solid var(--border-light);
    }

    .case-item-title {
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .case-item-link {
      color: var(--text-primary);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .case-item-link:hover {
      color: var(--accent-gold);
    }

    .ent-ref {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .case-item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      min-height: 38px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .copy-btn {
      background: var(--bg-pill);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
    }

    .copy-btn:hover {
      background: var(--bg-pill-hover);
      color: var(--text-primary);
    }

    .copy-btn.copied {
      background: rgba(34, 197, 94, 0.18);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.4);
    }

    .open-btn {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid var(--border-gold);
      color: var(--accent-gold);
    }

    .open-btn:hover {
      background: var(--accent-gold);
      color: #000;
    }

    .no-results-panel {
      text-align: center;
      padding: 36px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      color: var(--text-muted);
    }

    .load-more-box {
      text-align: center;
      margin-top: 20px;
    }

    .load-more-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      color: var(--accent-gold);
      font-weight: 700;
      padding: 12px 28px;
      min-height: 44px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .load-more-btn:hover {
      background: var(--accent-gold);
      color: #000;
    }

    mark.highlight {
      background: rgba(251, 191, 36, 0.25);
      color: var(--accent-gold);
      font-weight: 600;
      border-radius: 3px;
      padding: 0 3px;
    }

    .minimal-footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-light);
    }

    /* Mobile Responsive Styles (< 640px) */
    @media (max-width: 640px) {
      .top-nav {
        padding: 12px 16px;
      }
      .center-container {
        padding: 28px 12px 60px 12px;
      }
      .hero-header {
        margin-bottom: 20px;
      }
      .app-title {
        font-size: 2.2rem;
      }
      .app-tagline {
        font-size: 1rem;
      }
      .search-input-wrapper {
        padding: 0 14px;
        border-radius: 12px;
      }
      .main-search-input {
        padding: 14px 0;
        font-size: 1rem;
      }
      .case-item-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 16px;
      }
      .case-item-actions {
        width: 100%;
        justify-content: flex-end;
        margin-top: 4px;
      }
      .action-btn {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>

"url": "https://caseciter.in/sci-judgments/documents/ent_rZUUgPcsu7nW", "ent_id": "ent_rZUUgPcsu7nW", "citation": ""}, {"id": 865, "title": "PRABHAVATHI REDDY RAVI AND RAVI PRABHAVATHI vs. NALINI NERAIN AND OTHERS", "url": "https://caseciter.in/sci-judgments/documents/ent_abLbpKApm3d8", "ent_id": "ent_abLbpKApm3d8", "citation": ""}, {"id": 866, "title": "Gowtham Sampath & Anr. Through Power of Attorney vs. Gurdeep Singh Sandhu", "url": "https://caseciter.in/sci-judgments/documents/ent_VfARXG7Q5qCw", "ent_id": "ent_VfARXG7Q5qCw", "citation": ""}, {"id": 867, "title": "SUBHA & ORS. vs. THE UNITED INDIA INSURANCE COMPANY LTD. & ORS.", "url": "https://caseciter.in/sci-judgments/documents/ent_s9XA52TDxwrg", "ent_id": "ent_s9XA52TDxwrg", "citation": ""}, {"id": 868, "title": "KRISHI UPAJ MANDI SAMITI DHAR vs. PRESTIGE AGRO TECH LIMITED & ORS.", "url": "https://caseciter.in/sci-judgments/documents/ent_4z3FQfeeD9vD", "ent_id": "ent_4z3FQfeeD9vD", "citation": ""}, {"id": 869, "title": "DILIP vs. DEEPAK AND OTHERS", "url": "https://caseciter.in/sci-judgments/documents/ent_xcnLgeTg4WYw", "ent_id": "ent_xcnLgeTg4WYw", "citation": ""}, {"id": 870, "title": "RAMESH SINGH (DEAD) & ORS. vs. SRINIVAS REDDY & ORS.", "url": "https://caseciter.in/sci-judgments/documents/ent_3MPLbzSYerzP", "ent_id": "ent_3MPLbzSYerzP", "citation": ""}, {"id": 871, "title": "MOHAMMED ABDUL AHAD SHAKER vs. STATE OF TELANGANA AND ANOTHER", "url": "https://caseciter.in/sci-judgments/documents/ent_GH6oXPiN8PPT", "ent_id": "ent_GH6oXPiN8PPT", "citation": ""}, {"id": 872, "title": "ANJALI BHARDWAJ & ORS. vs. UNION OF INDIA & ORS.", "url": "https://caseciter.in/sci-judgments/documents/ent_g8mY9q8oMrQU", "ent_id": "ent_g8mY9q8oMrQU", "citation": ""}, {"id": 875, "title": "VINODBHAI BABUBHAI PARMAR vs. STATE OF GUJARAT", "url": "https://caseciter.in/sci-judgments/documents/ent_uVs7zwwbjwPs", "ent_id": "ent_uVs7zwwbjwPs", "citation": ""}, {"id": 876, "title": "SARAJIT MALLICK AND ANR. vs. STATE OF WEST BENGAL", "url": "https://caseciter.in/sci-judgments/documents/ent_srUbaUUUYEEs", "ent_id": "ent_srUbaUUUYEEs", "citation": ""}, {"id": 878, "title": "SANTOSH A. BEHERE vs. THE STATE OF MAHARASHTRA", "url": "https://caseciter.in/sci-judgments/documents/ent_tfhMPDc2o95K", "ent_id": "ent_tfhMPDc2o95K", "citation": ""}, {"id": 880, "title": "N.R. MANI vs. S.P. SIVAKUMAR", "url": "https://caseciter.in/sci-judgments/documents/ent_9VB6NsJhGY4e", "ent_id": "ent_9VB6NsJhGY4e", "citation": ""}, {"id": 881, "title": "HARSHITA GROVER vs. UNION OF INDIA & ORS.", "url": "https://caseciter.in/sci-judgments/documents/ent_bPPBBG4FavS3", "ent_id": "ent_bPPBBG4FavS3", "citation": ""}, {"id": 883, "title": "SHAILENDRA MANI TRIPATHI vs. UNION OF INDIA & ORS.", "url": "https://caseciter.in/sci-judgments/documents/ent_6eN54UgAk2So", "ent_id": "ent_6eN54UgAk2So", "citation": ""}, {"id": 888, "title": "H.D.F.C. BANK LTD. vs. UMESH AMBIKA PRASAD MISHRA", "url": "https://caseciter.in/sci-judgments/documents/ent_d9KswtsYRrZC", "ent_id": "ent_d9KswtsYRrZC", "citation": ""}, {"id": 902, "title": "ABDUL BAQUI ANSARI & ORS. vs. UNION OF INDIA & ORS.", "url": "https://caseciter.in/sci-judgments/documents/ent_YrGeFq5zskYC", "ent_id": "ent_YrGeFq5zskYC", "citation": ""}, {"id": 903, "title": "STATE OF ODISHA & ORS. vs. PRASANTA KUMAR MALLICK", "url": "https://caseciter.in/sci-judgments/documents/ent_UbJscC3iMHLb", "ent_id": "ent_UbJscC3iMHLb", "citation": ""}];

    // Theme Management
    let currentTheme = localStorage.getItem('citecase_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    const themeBtn = document.getElementById('themeToggleBtn');
    themeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

    themeBtn.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('citecase_theme', currentTheme);
      themeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
    });

    // Elements
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const resultsContainer = document.getElementById('resultsContainer');
    const resultsCount = document.getElementById('resultsCount');
    const resultsList = document.getElementById('resultsList');
    const loadMoreBox = document.getElementById('loadMoreBox');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    let currentFiltered = [];
    let displayLimit = 30;
    let activeSearchTerm = "";

    // Exact Match & Relevance Ranking
    function filterAndRankCases(query) {
      if (!query) return [];
      const q = query.trim().toLowerCase();

      let queryInscNum = null;
      const inscMatch = q.match(/insc\s*(\d+)/i) || q.match(/2026\s+insc\s+(\d+)/i);
      if (inscMatch) {
        queryInscNum = parseInt(inscMatch[1], 10);
      } else if (/^\d+$/.test(q)) {
        queryInscNum = parseInt(q, 10);
      }

      function getScore(item) {
        const cit = (item.citation || '').toLowerCase().trim();
        const title = (item.title || '').toLowerCase();
        const entId = (item.ent_id || '').toLowerCase();

        let itemInscNum = null;
        if (item.citation) {
          const cm = item.citation.match(/2026\s+INSC\s+(\d+)/i);
          if (cm) itemInscNum = parseInt(cm[1], 10);
        }

        if (cit === q) return 0;
        if (queryInscNum !== null && itemInscNum === queryInscNum) return 1;
        if (cit.startsWith(q)) return 2;
        if (cit.includes(q)) return 3;
        if (title.startsWith(q)) return 4;
        if (title.includes(q)) return 5;
        if (entId.includes(q)) return 6;
        return 10;
      }

      const matches = CASES.filter(item => {
        const cit = (item.citation || '').toLowerCase();
        const tit = (item.title || '').toLowerCase();
        const eid = (item.ent_id || '').toLowerCase();
        return cit.includes(q) || tit.includes(q) || eid.includes(q);
      });

      matches.sort((a, b) => {
        const scoreA = getScore(a);
        const scoreB = getScore(b);
        if (scoreA !== scoreB) return scoreA - scoreB;

        const parseNum = (x) => {
          if (!x.citation) return 0;
          const m = x.citation.match(/2026\s+INSC\s+(\d+)/i);
          return m ? parseInt(m[1], 10) : 0;
        };
        return parseNum(a) - parseNum(b);
      });

      return matches;
    }

    function highlightText(text, term) {
      if (!term || !text) return text;
      const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escaped})`, 'gi');
      return text.replace(regex, '<mark class="highlight">$1</mark>');
    }

    function renderResults() {
      const query = searchInput.value.trim();
      activeSearchTerm = query;

      if (!query) {
        resultsContainer.classList.remove('visible');
        clearBtn.classList.remove('visible');
        resultsList.innerHTML = '';
        return;
      }

      clearBtn.classList.add('visible');
      resultsContainer.classList.add('visible');

      currentFiltered = filterAndRankCases(query);
      resultsCount.innerHTML = `Found <strong>${currentFiltered.length}</strong> matching judgments`;

      if (currentFiltered.length === 0) {
        resultsList.innerHTML = `<div class="no-results-panel"><p>No judgments found matching "${query}"</p></div>`;
        loadMoreBox.style.display = 'none';
        return;
      }

      const visibleSlice = currentFiltered.slice(0, displayLimit);
      resultsList.innerHTML = visibleSlice.map(item => {
        const citBadge = item.citation 
          ? `<span class="badge citation-badge">📄 ${highlightText(item.citation, query)}</span>`
          : `<span class="badge pending-badge">Pending Citation</span>`;
        
        const refTag = item.ent_id 
          ? `<span class="ent-ref">Ref: ${highlightText(item.ent_id, query)}</span>` 
          : '';

        return `
          <div class="case-item-card">
            <div class="case-item-main">
              <div class="citation-header">${citBadge}</div>
              <h3 class="case-item-title">
                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="case-item-link">
                  ${highlightText(item.title, query)}
                </a>
              </h3>
              ${refTag}
            </div>
            <div class="case-item-actions">
              <button class="action-btn copy-btn" onclick="copyCitation('${item.id}', event)">
                📋 Copy
              </button>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="action-btn open-btn">
                View ↗
              </a>
            </div>
          </div>
        `;
      }).join('');

      if (displayLimit < currentFiltered.length) {
        loadMoreBox.style.display = 'block';
        loadMoreBtn.textContent = `Load More (${currentFiltered.length - displayLimit} remaining)`;
      } else {
        loadMoreBox.style.display = 'none';
      }
    }

    function copyCitation(id, event) {
      const item = CASES.find(c => c.id == id);
      if (!item) return;
      const text = item.citation ? `${item.title} (${item.citation})` : `${item.title} [Ref: ${item.ent_id}]`;
      
      navigator.clipboard.writeText(text);
      const btn = event.currentTarget;
      const oldHTML = btn.innerHTML;
      btn.innerHTML = "✅ Copied";
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = oldHTML;
        btn.classList.remove('copied');
      }, 2000);
    }

    searchInput.addEventListener('input', () => {
      displayLimit = 30;
      renderResults();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      displayLimit = 30;
      renderResults();
      searchInput.focus();
    });

    loadMoreBtn.addEventListener('click', () => {
      displayLimit += 30;
      renderResults();
    });
  </script>
